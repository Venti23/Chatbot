<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>PanteraBot</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: white;
      padding: 2rem;
    }
    #chat {
      max-width: 600px;
      margin-bottom: 1rem;
      padding: 1rem;
      background: #1e1e1e;
      border-radius: 10px;
      height: 400px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .msg {
      max-width: 70%;
      padding: 10px 15px;
      margin: 5px 0;
      border-radius: 20px;
      word-wrap: break-word;
      line-height: 1.4em;
    }
    .user {
      background: #444;
      align-self: flex-end;
      margin-left: auto;
      text-align: right;
    }
    .bot {
      background: #222;
      border-left: 4px solid #ff0055;
      align-self: flex-start;
    }
    input {
      padding: 10px;
      width: 70%;
      border-radius: 8px;
      border: none;
    }
    button {
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #ff0055;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>🐾 PanteraBot</h2>
  <div id="chat"></div>
  <input type="text" id="userInput" placeholder="Digite sua pergunta ou número da opção..." onkeydown="checarEnter(event)" />
  <button onclick="sendMessage()">Enviar</button>

  <script>
    async function sendMessage() {
      const input = document.getElementById("userInput");
      const message = input.value.trim();
      if (!message) return;
  
      // Cria a mensagem do usuário com ID para possível substituição
      let msgEl = document.createElement("div");
      msgEl.className = "msg user";
      if (!isNaN(message)) {
  msgEl.id = "ultimaPergunta";
}

      msgEl.innerText = message;
      document.getElementById("chat").appendChild(msgEl);
      input.value = "";
  
      
      const digitando = document.createElement("div");
      digitando.className = "msg bot";
      digitando.id = "digitando";
      digitando.innerHTML = "<em>PanteraBot está digitando...</em>";
      document.getElementById("chat").appendChild(digitando);
  
      
      setTimeout(async () => {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
  
        const data = await res.json();
  
        
        document.getElementById("digitando").remove();
  
        
        const ultima = document.getElementById("ultimaPergunta");
        if (data.pergunta && ultima) {
          ultima.innerText = data.pergunta;
        }
  
        
        const respostaBot = document.createElement("div");
        respostaBot.className = "msg bot";
        respostaBot.innerText = data.response;
        document.getElementById("chat").appendChild(respostaBot);
        document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
      }, 1000);
    }
  
    function checarEnter(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }
  </script>
  
</body>
</html>
